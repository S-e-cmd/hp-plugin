name: Temporary guarded runtime context cache

on:
  push:
    branches:
      - agent/cache-runtime-context

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Fix guarded runtime context cache workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache runtime context per request
        shell: python
        run: |
          from pathlib import Path
          paths = [Path('garden-opening-status/garden-opening-status.php'), Path('plugins/garden-opening-status/garden-opening-status.php')]
          texts = [p.read_text(encoding='utf-8') for p in paths]
          if texts[0] != texts[1]:
              raise SystemExit('duplicate PHP copies differ before cleanup')
          text = texts[0]
          old = '\n'.join([
              '    private static function runtime_context() {',
              '        $o = self::options();',
              "        $forced_state = '';",
              "        $forced_event = '';",
          ])
          new = '\n'.join([
              '    private static function runtime_context() {',
              '        static $context = null;',
              '        if ($context !== null) return $context;',
              '',
              '        $o = self::options();',
              "        $forced_state = '';",
              "        $forced_event = '';",
          ])
          if text.count(old) != 1:
              raise SystemExit(f'unexpected runtime_context start count: {text.count(old)}')
          text = text.replace(old, new, 1)
          old_return = "        return [$o, $model];\n    }\n\n    private static function should_render() {"
          new_return = "        $context = [$o, $model];\n        return $context;\n    }\n\n    private static function should_render() {"
          if text.count(old_return) != 1:
              raise SystemExit(f'unexpected runtime_context return count: {text.count(old_return)}')
          text = text.replace(old_return, new_return, 1)
          for p in paths:
              p.write_text(text, encoding='utf-8')
      - name: Validate PHP and duplicate copies
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/agent-cache-runtime-context.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git commit -m "Cache runtime context within request"
          git push origin HEAD:agent/cache-runtime-context
