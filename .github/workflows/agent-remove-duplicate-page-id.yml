name: Temporary guarded duplicate page ID cleanup

on:
  push:
    branches:
      - agent/remove-duplicate-page-id-resolution

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Add guarded duplicate page ID cleanup workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove redundant page ID resolution
        shell: python
        run: |
          from pathlib import Path
          paths=[Path('garden-opening-status/garden-opening-status.php'),Path('plugins/garden-opening-status/garden-opening-status.php')]
          texts=[p.read_text(encoding='utf-8') for p in paths]
          if texts[0] != texts[1]:
              raise SystemExit('duplicate PHP copies differ before cleanup')
          text=texts[0]
          old="""            if ($description_parts) {
                $item['description'] = implode(' ', $description_parts);
            }

            $page_id = self::resolve_event_page_id($event, $season);
            if ($page_id > 0) {
"""
          new="""            if ($description_parts) {
                $item['description'] = implode(' ', $description_parts);
            }

            if ($page_id > 0) {
"""
          if text.count(old) != 1:
              raise SystemExit(f'unexpected target block count: {text.count(old)}')
          text=text.replace(old,new,1)
          for p in paths:
              p.write_text(text,encoding='utf-8')
      - name: Validate PHP and duplicate copies
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/agent-remove-duplicate-page-id.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git commit -m "Reuse resolved event page ID"
          git push origin HEAD:agent/remove-duplicate-page-id-resolution
