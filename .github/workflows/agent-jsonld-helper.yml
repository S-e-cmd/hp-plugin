name: Temporary guarded JSON-LD helper refactor

on:
  push:
    branches:
      - agent/php-jsonld-helper

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.head_commit.message == 'Add guarded JSON-LD helper workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact JSON-LD helper extraction
        shell: python
        run: |
          from pathlib import Path
          paths=[Path('garden-opening-status/garden-opening-status.php'),Path('plugins/garden-opening-status/garden-opening-status.php')]
          texts=[p.read_text(encoding='utf-8') for p in paths]
          if texts[0] != texts[1]:
              raise SystemExit('duplicate PHP copies differ before refactor')
          text=texts[0]
          block="""        echo '<script type=\"application/ld+json\">';
        echo wp_json_encode($data, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES);
        echo '</script>' . \"\\n\";
"""
          if text.count(block) != 4:
              raise SystemExit(f'unexpected JSON-LD output block count: {text.count(block)}')
          text=text.replace(block,"        self::output_json_ld($data);\n")
          marker="    public static function output_permanent_guide_structured_data() {\n"
          if text.count(marker) != 1:
              raise SystemExit('output_permanent_guide_structured_data marker not unique')
          helper="""    private static function output_json_ld($data) {
        echo '<script type=\"application/ld+json\">';
        echo wp_json_encode($data, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES);
        echo '</script>' . \"\\n\";
    }

"""
          text=text.replace(marker,helper+marker,1)
          if text.count('self::output_json_ld($data);') != 4:
              raise SystemExit('expected four helper call sites')
          if text.count('private static function output_json_ld($data)') != 1:
              raise SystemExit('expected one helper definition')
          for p in paths:
              p.write_text(text,encoding='utf-8')
      - name: Validate PHP and duplicate copies
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/agent-jsonld-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git commit -m "Consolidate repeated JSON-LD output"
          git push origin HEAD:agent/php-jsonld-helper
