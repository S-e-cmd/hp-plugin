name: Apply autumn page SEO 3.2.90
on:
  push:
    branches: [feature/autumn-page-seo-3290]
    paths: ['.github/workflows/agent-autumn-seo-3290.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/autumn-page-seo-3290
      - name: Patch and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ps=[Path('garden-opening-status/garden-opening-status.php'),Path('plugins/garden-opening-status/garden-opening-status.php')]
          for p in ps:
            s=p.read_text()
            s=s.replace('Version: 3.2.89','Version: 3.2.90',1).replace("const VERSION = '3.2.89';","const VERSION = '3.2.90';",1).replace('Garden Opening Status 3.2.89 multilingual SEO active','Garden Opening Status 3.2.90 multilingual SEO active',1)
            a="$is_spring = $season === 'spring';"
            assert a in s
            s=s.replace(a,a+"\n        $is_autumn = $season === 'autumn';",1)
            a="""                if ($is_spring) {
                    return [
                        'title' => $name . '｜' . $range . '｜東京・上野の上野東照宮ぼたん苑',
                        'description' => $description . '東京・上野の上野東照宮ぼたん苑で、牡丹をはじめとする春の花を楽しめます。開苑時間、入苑料、アクセスなどをご案内します。',
                    ];
                }
"""
            b=a+"""                if ($is_autumn) {
                    return [
                        'title' => $name . '｜' . $range . '｜東京・上野の上野東照宮ぼたん苑',
                        'description' => $description . '東京・上野の上野東照宮ぼたん苑で、多彩なダリアをはじめとする秋の花を楽しめます。開苑時間、入苑料、アクセスなどをご案内します。',
                    ];
                }
"""
            assert a in s
            s=s.replace(a,b,1)
            a="""        if ($is_spring) {
            return [
                'title' => '東京・上野で牡丹を楽しむ｜' . $name . '｜上野東照宮ぼたん苑',
                'description' => '東京・上野の上野東照宮ぼたん苑で開催する' . $name . '。日本庭園で牡丹をはじめとする春の花を楽しめます。' . ($usual !== '' ? '例年の開苑時期は' . $usual . 'です。' : '') . '開苑時間、入苑料、アクセスをご案内します。',
            ];
        }
"""
            b=a+"""        if ($is_autumn) {
            return [
                'title' => '東京・上野でダリアを楽しむ｜' . $name . '｜上野東照宮ぼたん苑',
                'description' => '東京・上野の上野東照宮ぼたん苑で開催する' . $name . '。秋の庭園で多彩なダリアを楽しめます。' . ($usual !== '' ? '例年の開苑時期は' . $usual . 'です。' : '') . '開苑時間、入苑料、アクセスをご案内します。',
            ];
        }
"""
            assert a in s
            p.write_text(s.replace(a,b,1))
          entry="""開催情報・開催状況管理 3.2.90

3.2.90:
- 秋の固定会期ページ /schedule/autumn/ の表示本文を変更せず、「東京・上野・ダリア・秋の花」文脈をtitle / descriptionへ追加
- 通常時は例年会期を維持し、確定会期公開後は既存の日付連動を維持したままtitle / descriptionへ東京・上野・ダリアの文脈を追加
- AIOSEO経由のOG / Twitter / WebPage schemaへの既存同期を維持
- Event schema、春・冬、トップ、会期一覧、英語・繁体字、本文・見出し・レイアウトには変更なし

"""
          for p in [Path('garden-opening-status/readme.txt'),Path('plugins/garden-opening-status/readme.txt')]:
            s=p.read_text(); assert s.startswith('開催情報・開催状況管理 3.2.89'); p.write_text(entry+s)
          PY
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/readme.txt plugins/garden-opening-status/readme.txt
          git diff --check
          grep -F '東京・上野でダリアを楽しむ' garden-opening-status/garden-opening-status.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add garden-opening-status plugins/garden-opening-status
          git commit -m 'Optimize autumn page SEO metadata in 3.2.90'
          git push origin HEAD:feature/autumn-page-seo-3290
