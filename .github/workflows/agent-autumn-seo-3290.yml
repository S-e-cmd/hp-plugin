name: Apply autumn page SEO 3.2.90
on:
  push:
    branches: [feature/autumn-page-seo-3290]
    paths: ['.github/workflows/agent-autumn-seo-3290.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/autumn-page-seo-3290
      - name: Apply patch
        run: python3 .github/agent-autumn-3290.py
      - name: Validate
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/readme.txt plugins/garden-opening-status/readme.txt
          git diff --check
          grep -F 'Version: 3.2.90' garden-opening-status/garden-opening-status.php
          grep -F '東京・上野でダリアを楽しむ' garden-opening-status/garden-opening-status.php
          grep -F "$is_autumn = $season === 'autumn';" garden-opening-status/garden-opening-status.php
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add garden-opening-status plugins/garden-opening-status
          git commit -m 'Optimize autumn page SEO metadata in 3.2.90'
          git push origin HEAD:feature/autumn-page-seo-3290
