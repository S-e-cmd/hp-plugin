name: Apply access page SEO 3.2.92
on:
  push:
    branches: [feature/access-page-seo-3292]
    paths: ['.github/workflows/agent-access-seo-3292.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/access-page-seo-3292
      - name: Apply patch
        run: python3 .github/agent-access-3292.py
      - name: Validate
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/readme.txt plugins/garden-opening-status/readme.txt
          git diff --check
          grep -F 'Version: 3.2.92' garden-opening-status/garden-opening-status.php
          grep -F '上野東照宮ぼたん苑へのアクセス｜上野駅・上野公園からの行き方' garden-opening-status/garden-opening-status.php
          grep -F "is_page('access')" garden-opening-status/garden-opening-status.php
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add garden-opening-status plugins/garden-opening-status
          git commit -m 'Optimize access page SEO metadata in 3.2.92'
          git push origin HEAD:feature/access-page-seo-3292
