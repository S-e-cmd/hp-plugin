name: Apply mobile event bottom spacer 3.2.98
on:
  push:
    branches: [fix/mobile-event-bottom-spacer-3298]
    paths:
      - '.github/workflows/agent-mobile-spacer-3298.yml'
      - '.github/agent-mobile-spacer-3298.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-event-bottom-spacer-3298
      - name: Apply scoped patch
        run: python .github/agent-mobile-spacer-3298.py
      - name: Validate
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/readme.txt plugins/garden-opening-status/readme.txt
          git diff --check
          grep -q "Version: 3.2.98" garden-opening-status/garden-opening-status.php
          grep -q "seasonal_mobile_bottom_spacer" garden-opening-status/garden-opening-status.php
          ! grep -q "body.gos-seasonal-event-page" garden-opening-status/garden-opening-status.php
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add garden-opening-status plugins/garden-opening-status
          git diff --cached --quiet && exit 0
          git commit -m "Fix mobile event page bottom spacing in 3.2.98"
          git push
