name: Apply garden-opening-status v3.2.24

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-garden-opening-status-v3.2.24.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/garden-opening-status-v3.2.24
          fetch-depth: 0

      - name: Restore verified v3.2.24 package
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:archives/garden-opening-status/v3.2.24/garden-opening-status-v3.2.24.zip.b64.part00 > /tmp/part00
          git show origin/main:archives/garden-opening-status/v3.2.24/garden-opening-status-v3.2.24.zip.b64.part01 > /tmp/part01
          cat /tmp/part00 /tmp/part01 \
            | tr -d '\n\r ' \
            | base64 --decode \
            > /tmp/garden-opening-status-v3.2.24.zip
          echo 'd0753924c9bd576170f98a63a44755d183cd55466c482de73c69ec7b3aa3cc66  /tmp/garden-opening-status-v3.2.24.zip' | sha256sum -c -
          rm -rf /tmp/gos324
          mkdir -p /tmp/gos324
          unzip -q /tmp/garden-opening-status-v3.2.24.zip -d /tmp/gos324

      - name: Replace all plugin source files
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/gos324/garden-opening-status/garden-opening-status.php garden-opening-status/garden-opening-status.php
          cp /tmp/gos324/garden-opening-status/assets/admin.js garden-opening-status/assets/admin.js
          cp /tmp/gos324/garden-opening-status/assets/admin.css garden-opening-status/assets/admin.css
          cp /tmp/gos324/garden-opening-status/readme.txt garden-opening-status/readme.txt
          php -l garden-opening-status/garden-opening-status.php
          node --check garden-opening-status/assets/admin.js

      - name: Commit v3.2.24 to work branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add garden-opening-status/garden-opening-status.php \
                  garden-opening-status/assets/admin.js \
                  garden-opening-status/assets/admin.css \
                  garden-opening-status/readme.txt
          if git diff --cached --quiet; then
            echo 'No source changes detected.'
            exit 0
          fi
          git commit -m 'Update garden-opening-status to v3.2.24'
          git push origin HEAD:work/garden-opening-status-v3.2.24
