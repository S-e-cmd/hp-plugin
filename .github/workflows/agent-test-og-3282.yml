name: Test multilingual OG 3.2.82
on:
  push:
    branches: [feature/multilingual-theme-og-3282]
jobs:
  test:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multilingual-theme-og-3282
      - name: Run OG regression test
        run: php .github/agent-test-og-3282.php
      - name: Remove temporary test files
        run: |
          rm .github/agent-test-og-3282.php
          rm .github/workflows/agent-test-og-3282.yml
          git add .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary multilingual OG regression test"
          git push origin HEAD:feature/multilingual-theme-og-3282
