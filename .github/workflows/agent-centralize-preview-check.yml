name: Temporary guarded preview check cleanup

on:
  push:
    branches:
      - agent/centralize-preview-check

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Add guarded preview check cleanup workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Centralize preview condition
        shell: python
        run: |
          from pathlib import Path
          paths = [Path('garden-opening-status/garden-opening-status.php'), Path('plugins/garden-opening-status/garden-opening-status.php')]
          texts = [p.read_text(encoding='utf-8') for p in paths]
          if texts[0] != texts[1]:
              raise SystemExit('duplicate PHP copies differ before cleanup')
          text = texts[0]
          marker = '    private static function runtime_context() {\n'
          helper = "    private static function is_status_preview() {\n        return current_user_can('manage_options') && !empty($_GET['garden_status_preview']);\n    }\n\n"
          if text.count(marker) != 1:
              raise SystemExit(f'unexpected runtime_context marker count: {text.count(marker)}')
          text = text.replace(marker, helper + marker, 1)
          target = "current_user_can('manage_options') && !empty($_GET['garden_status_preview'])"
          if text.count(target) != 4:
              raise SystemExit(f'unexpected preview condition count before replacement: {text.count(target)}')
          first = text.index(target)
          pos = first + len(target)
          for _ in range(3):
              idx = text.find(target, pos)
              if idx < 0:
                  raise SystemExit('missing expected preview condition occurrence')
              text = text[:idx] + 'self::is_status_preview()' + text[idx + len(target):]
              pos = idx + len('self::is_status_preview()')
          if text.count(target) != 1 or text.count('self::is_status_preview()') != 3:
              raise SystemExit('unexpected preview helper replacement result')
          for p in paths:
              p.write_text(text, encoding='utf-8')
      - name: Validate PHP and duplicate copies
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/agent-centralize-preview-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git commit -m "Centralize status preview condition"
          git push origin HEAD:agent/centralize-preview-check
