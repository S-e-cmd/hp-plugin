name: Apply multilingual SEO 3.2.80
on:
  push:
    branches:
      - feature/multilingual-seo-3280
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multilingual-seo-3280
          fetch-depth: 0
      - name: Apply patch
        run: python .agent-multilingual-seo-3280.py
      - name: Validate
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/readme.txt plugins/garden-opening-status/readme.txt
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add garden-opening-status plugins/garden-opening-status
          git commit -m "Use AIOSEO filters for multilingual SEO in 3.2.80"
          git rm .agent-multilingual-seo-3280.py .github/workflows/agent-multilingual-seo-3280.yml
          git commit -m "Remove temporary multilingual SEO patch files"
          git push origin HEAD:feature/multilingual-seo-3280
