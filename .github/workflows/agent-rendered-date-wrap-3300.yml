name: Apply rendered confirmed date wrap 3.3.0
on:
  push:
    branches: [fix/rendered-confirmed-date-wrap-3300]
    paths:
      - '.github/workflows/agent-rendered-date-wrap-3300.yml'
      - '.github/agent-rendered-date-wrap-3300.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rendered-confirmed-date-wrap-3300
      - name: Apply scoped patch
        run: python .github/agent-rendered-date-wrap-3300.py
      - name: Validate
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/readme.txt plugins/garden-opening-status/readme.txt
          git diff --check
          grep -q "Version: 3.3.0" garden-opening-status/garden-opening-status.php
          grep -q "seasonal_confirmed_date_wrap" garden-opening-status/garden-opening-status.php
          grep -q "gos-seasonal-confirmed-date-wrap" garden-opening-status/garden-opening-status.php
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add garden-opening-status plugins/garden-opening-status
          git diff --cached --quiet && exit 0
          git commit -m "Fix rendered confirmed date wrap in 3.3.0"
          git push
