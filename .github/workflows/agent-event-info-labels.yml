name: Temporary guarded event info label cleanup

on:
  push:
    branches:
      - agent/centralize-event-info-labels

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Add guarded event info label cleanup workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Centralize event info labels
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          paths = [Path('garden-opening-status/garden-opening-status.php'), Path('plugins/garden-opening-status/garden-opening-status.php')]
          texts = [p.read_text(encoding='utf-8') for p in paths]
          if texts[0] != texts[1]:
              raise SystemExit('duplicate PHP copies differ before cleanup')
          text = texts[0]

          anchor = "    private static function event_page_output_values($season) {\n"
          helper = (
              "    private static function event_info_labels($event) {\n"
              "        return [\n"
              "            'date' => trim((string)($event['date_label'] ?? '')) ?: '開苑期間',\n"
              "            'time' => trim((string)($event['time_label'] ?? '')) ?: '開苑時間',\n"
              "            'price' => trim((string)($event['admission_label'] ?? '')) ?: '入苑料',\n"
              "        ];\n"
              "    }\n\n"
              "    private static function event_page_output_values($season) {\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'unexpected event_page_output_values anchor count: {text.count(anchor)}')
          text = text.replace(anchor, helper, 1)

          old_return = (
              "        return [\n"
              "            'date_label' => trim((string)($event['date_label'] ?? '開苑期間')) ?: '開苑期間',\n"
              "            'date' => $date,\n"
              "            'time_label' => trim((string)($event['time_label'] ?? '開苑時間')) ?: '開苑時間',\n"
              "            'time' => $time,\n"
              "            'price_label' => trim((string)($event['admission_label'] ?? '入苑料')) ?: '入苑料',\n"
              "            'price' => $price,\n"
              "        ];"
          )
          new_return = (
              "        $labels = self::event_info_labels($event);\n"
              "        return [\n"
              "            'date_label' => $labels['date'],\n"
              "            'date' => $date,\n"
              "            'time_label' => $labels['time'],\n"
              "            'time' => $time,\n"
              "            'price_label' => $labels['price'],\n"
              "            'price' => $price,\n"
              "        ];"
          )
          if text.count(old_return) != 1:
              raise SystemExit(f'unexpected event page label block count: {text.count(old_return)}')
          text = text.replace(old_return, new_return, 1)

          old_labels = (
              "        $labels = [\n"
              "            'ja' => [\n"
              "                'date' => trim((string)($event['date_label'] ?? '')) ?: '開苑期間',\n"
              "                'time' => trim((string)($event['time_label'] ?? '')) ?: '開苑時間',\n"
              "                'price' => trim((string)($event['admission_label'] ?? '')) ?: '入苑料',\n"
              "            ],\n"
          )
          new_labels = (
              "        $labels = [\n"
              "            'ja' => self::event_info_labels($event),\n"
          )
          if text.count(old_labels) != 1:
              raise SystemExit(f'unexpected shortcode ja label block count: {text.count(old_labels)}')
          text = text.replace(old_labels, new_labels, 1)

          if text.count('private static function event_info_labels($event)') != 1:
              raise SystemExit('event_info_labels helper count mismatch')
          if text.count("'ja' => self::event_info_labels($event)") != 1:
              raise SystemExit('shortcode helper use missing')

          for p in paths:
              p.write_text(text, encoding='utf-8')
          PY
      - name: Validate PHP and duplicate copies
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/agent-event-info-labels.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git commit -m "Centralize event info labels"
          git push origin HEAD:agent/centralize-event-info-labels
