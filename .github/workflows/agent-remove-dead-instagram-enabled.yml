name: Temporary guarded dead Instagram enabled cleanup

on:
  push:
    branches:
      - agent/remove-dead-instagram-enabled

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Narrow Instagram enabled cleanup assertions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove dead Instagram enabled setting
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          paths = [Path('garden-opening-status/garden-opening-status.php'), Path('plugins/garden-opening-status/garden-opening-status.php')]
          texts = [p.read_text(encoding='utf-8') for p in paths]
          if texts[0] != texts[1]:
              raise SystemExit('duplicate PHP copies differ before cleanup')
          text = texts[0]

          defaults_start = text.index('    private static function instagram_defaults() {')
          defaults_end = text.index('    private static function instagram_options() {', defaults_start)
          defaults_block = text[defaults_start:defaults_end]
          default_line = "            'enabled' => 0,\n"
          if defaults_block.count(default_line) != 1:
              raise SystemExit(f'unexpected Instagram enabled default count: {defaults_block.count(default_line)}')
          defaults_block = defaults_block.replace(default_line, '', 1)
          text = text[:defaults_start] + defaults_block + text[defaults_end:]

          save_start = text.index('    public static function instagram_save() {')
          save_end = text.index('    public static function instagram_refresh_action() {', save_start)
          save_block = text[save_start:save_end]
          save_line = "        $o['enabled'] = !empty($_POST['enabled']) ? 1 : 0;\n"
          if save_block.count(save_line) != 1:
              raise SystemExit(f'unexpected Instagram enabled save count: {save_block.count(save_line)}')
          save_block = save_block.replace(save_line, '', 1)
          text = text[:save_start] + save_block + text[save_end:]

          new_defaults_start = text.index('    private static function instagram_defaults() {')
          new_defaults_end = text.index('    private static function instagram_options() {', new_defaults_start)
          new_save_start = text.index('    public static function instagram_save() {')
          new_save_end = text.index('    public static function instagram_refresh_action() {', new_save_start)
          if "'enabled'" in text[new_defaults_start:new_defaults_end]:
              raise SystemExit('Instagram enabled default remains')
          if "$o['enabled']" in text[new_save_start:new_save_end]:
              raise SystemExit('Instagram enabled save remains')

          for p in paths:
              p.write_text(text, encoding='utf-8')
          PY
      - name: Validate PHP and duplicate copies
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/agent-remove-dead-instagram-enabled.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git commit -m "Remove dead Instagram enabled setting"
          git push origin HEAD:agent/remove-dead-instagram-enabled
