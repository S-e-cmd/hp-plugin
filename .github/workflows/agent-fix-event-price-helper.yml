name: Temporary guarded event price helper fix

on:
  push:
    branches:
      - agent/centralize-event-price-details

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Add guarded event price helper fix workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix event price helper body
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          paths = [Path('garden-opening-status/garden-opening-status.php'), Path('plugins/garden-opening-status/garden-opening-status.php')]
          texts = [p.read_text(encoding='utf-8') for p in paths]
          if texts[0] != texts[1]:
              raise SystemExit('duplicate PHP copies differ before fix')
          text = texts[0]
          broken = "    private static function event_price_details($event) {\n        $price = self::event_price_details($event);\n        return $price;\n    }"
          fixed = "    private static function event_price_details($event) {\n        $price = trim((string)($event['price_details'] ?? ''));\n        if ($price === '') $price = trim((string)($event['price'] ?? ''));\n        return $price;\n    }"
          if text.count(broken) != 1:
              raise SystemExit(f'unexpected broken helper count: {text.count(broken)}')
          text = text.replace(broken, fixed, 1)
          if text.count('self::event_price_details($event)') != 2:
              raise SystemExit(f'unexpected helper call count: {text.count("self::event_price_details($event)")}')
          if text.count("$price = trim((string)($event['price_details'] ?? ''));") != 1:
              raise SystemExit('helper fallback body not unique after fix')
          for p in paths:
              p.write_text(text, encoding='utf-8')
          PY
      - name: Validate PHP and duplicate copies
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/agent-fix-event-price-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git commit -m "Fix event price details helper body"
          git push origin HEAD:agent/centralize-event-price-details
