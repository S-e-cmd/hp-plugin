name: Temporary guarded Instagram option storage cleanup

on:
  push:
    branches:
      - agent/store-instagram-options

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Add guarded Instagram option storage workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Instagram option storage seam
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          paths = [Path('garden-opening-status/garden-opening-status.php'), Path('plugins/garden-opening-status/garden-opening-status.php')]
          texts = [p.read_text(encoding='utf-8') for p in paths]
          if texts[0] != texts[1]:
              raise SystemExit('duplicate PHP copies differ before cleanup')
          text = texts[0]

          write_line = "        update_option('gos_instagram_gallery_options', $o, false);"
          if text.count(write_line) != 6:
              raise SystemExit(f'unexpected Instagram option write count: {text.count(write_line)}')
          text = text.replace(write_line, "        self::store_instagram_options($o);")

          anchor_lines = [
              "    private static function instagram_options() {",
              "        $saved = get_option('gos_instagram_gallery_options', []);",
              "        $saved = is_array($saved) ? $saved : [];",
              "        return array_replace(self::instagram_defaults(), $saved);",
              "    }",
              "",
          ]
          anchor = '\n'.join(anchor_lines)
          if text.count(anchor) != 1:
              raise SystemExit(f'unexpected instagram_options anchor count: {text.count(anchor)}')
          replacement_lines = anchor_lines + [
              "    private static function store_instagram_options($options) {",
              "        update_option('gos_instagram_gallery_options', $options, false);",
              "    }",
              "",
          ]
          replacement = '\n'.join(replacement_lines)
          text = text.replace(anchor, replacement, 1)

          if text.count('private static function store_instagram_options($options)') != 1:
              raise SystemExit('storage helper count mismatch')
          if text.count("update_option('gos_instagram_gallery_options', $options, false);") != 1:
              raise SystemExit('raw storage call should exist only inside helper')
          if text.count('self::store_instagram_options($o);') != 6:
              raise SystemExit('storage helper call count mismatch')

          for p in paths:
              p.write_text(text, encoding='utf-8')
          PY
      - name: Validate PHP and duplicate copies
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/agent-store-instagram-options.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git commit -m "Centralize Instagram option storage"
          git push origin HEAD:agent/store-instagram-options
