name: Apply unreleased date guard 3.2.84
on:
  push:
    branches: [feature/unreleased-dates-3284]
    paths: ['.github/workflows/agent-unreleased-dates-3284.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unreleased-dates-3284
      - name: Apply patch
        run: python3 .github/agent-patch-gos-3284.py
      - name: Validate
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/readme.txt plugins/garden-opening-status/readme.txt
          git diff --check
          grep -F 'Version: 3.2.84' garden-opening-status/garden-opening-status.php
          grep -F 'event_released($event, self::now())' garden-opening-status/garden-opening-status.php
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prevent unreleased confirmed dates from leaking in 3.2.84"
          git push origin HEAD:feature/unreleased-dates-3284
