name: Temporary guarded key validation cleanup

on:
  push:
    branches:
      - agent/centralize-key-validation

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Add guarded key validation cleanup workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Centralize event and state key validation
        shell: python
        run: |
          from pathlib import Path
          paths = [Path('garden-opening-status/garden-opening-status.php'), Path('plugins/garden-opening-status/garden-opening-status.php')]
          texts = [p.read_text(encoding='utf-8') for p in paths]
          if texts[0] != texts[1]:
              raise SystemExit('duplicate PHP copies differ before cleanup')
          text = texts[0]
          anchor = "    private static function event_keys() {\n        return ['spring', 'autumn', 'winter'];\n    }\n"
          insert = "    private static function event_keys() {\n        return ['spring', 'autumn', 'winter'];\n    }\n\n    private static function is_event_key($key) {\n        return in_array($key, self::event_keys(), true);\n    }\n\n    private static function is_state_key($key) {\n        return in_array($key, self::state_keys(), true);\n    }\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'unexpected event_keys anchor count: {text.count(anchor)}')
          text = text.replace(anchor, insert, 1)
          replacements = [
              ("in_array(($input['manual_state'] ?? 'closed'), self::state_keys(), true)", "self::is_state_key(($input['manual_state'] ?? 'closed'))"),
              ("in_array(($input['manual_event'] ?? 'spring'), self::event_keys(), true)", "self::is_event_key(($input['manual_event'] ?? 'spring'))"),
              ("in_array($state, self::state_keys(), true)", "self::is_state_key($state)"),
              ("in_array($event, self::event_keys(), true)", "self::is_event_key($event)"),
              ("in_array($forced_state, self::state_keys(), true)", "self::is_state_key($forced_state)"),
              ("in_array($forced_event, self::event_keys(), true)", "self::is_event_key($forced_event)"),
              ("in_array(($o['manual_event'] ?? ''), self::event_keys(), true)", "self::is_event_key(($o['manual_event'] ?? ''))"),
              ("in_array($candidate, self::state_keys(), true)", "self::is_state_key($candidate)"),
              ("in_array($candidate_event, self::event_keys(), true)", "self::is_event_key($candidate_event)"),
              ("in_array(($model['event_key'] ?? ''), self::event_keys(), true)", "self::is_event_key(($model['event_key'] ?? ''))"),
              ("in_array($season, self::event_keys(), true)", "self::is_event_key($season)"),
              ("in_array($o['next_mode'], self::event_keys(), true)", "self::is_event_key($o['next_mode'])"),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'missing expected predicate: {old}')
              text = text.replace(old, new)
          for p in paths:
              p.write_text(text, encoding='utf-8')
      - name: Validate PHP and duplicate copies
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/agent-key-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git commit -m "Centralize event and state key validation"
          git push origin HEAD:agent/centralize-key-validation
