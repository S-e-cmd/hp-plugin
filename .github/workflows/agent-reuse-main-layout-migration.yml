name: Temporary guarded layout migration cleanup

on:
  push:
    branches:
      - agent/reuse-main-layout-migration

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Add guarded layout migration cleanup workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reuse main option read
        shell: python
        run: |
          from pathlib import Path
          paths = [Path('garden-opening-status/garden-opening-status.php'), Path('plugins/garden-opening-status/garden-opening-status.php')]
          texts = [p.read_text(encoding='utf-8') for p in paths]
          if texts[0] != texts[1]:
              raise SystemExit('duplicate PHP copies differ before cleanup')
          text = texts[0]
          start = text.index('    private static function maybe_migrate_layout_options() {')
          end = text.index('    private static function stored_layout_templates()', start)
          block = text[start:end]
          target = "        $existing = get_option(self::LAYOUTS_OPTION, null);\n"
          if block.count(target) != 1:
              raise SystemExit('unexpected migration function shape')
          block = block.replace(target, "        $main = get_option(self::OPTION, []);\n" + target, 1)
          repeated = "            $main = get_option(self::OPTION, []);\n"
          if block.count(repeated) != 2:
              raise SystemExit(f'unexpected repeated main option reads: {block.count(repeated)}')
          block = block.replace(repeated, '', 2)
          if block.count('$main = get_option(self::OPTION, []);') != 1:
              raise SystemExit('expected one main option read after cleanup')
          text = text[:start] + block + text[end:]
          for p in paths:
              p.write_text(text, encoding='utf-8')
      - name: Validate PHP and duplicate copies
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/agent-reuse-main-layout-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git commit -m "Reuse main option during layout migration"
          git push origin HEAD:agent/reuse-main-layout-migration
