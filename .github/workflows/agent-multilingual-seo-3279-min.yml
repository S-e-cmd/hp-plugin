name: Apply multilingual SEO 3.2.79
on:
  push:
    branches:
      - feature/multilingual-seo-3279
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multilingual-seo-3279
          fetch-depth: 0
      - run: python .github/agent/multilingual-seo-3279.py
      - run: php -l garden-opening-status/garden-opening-status.php
      - run: php -l plugins/garden-opening-status/garden-opening-status.php
      - run: cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
      - run: cmp garden-opening-status/readme.txt plugins/garden-opening-status/readme.txt
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add garden-opening-status plugins/garden-opening-status
          git commit -m "Localize multilingual SEO metadata in 3.2.79"
          git rm .github/agent/multilingual-seo-3279.py .github/workflows/agent-multilingual-seo-3279.yml .github/workflows/agent-multilingual-seo-3279-min.yml
          git commit -m "Remove temporary multilingual SEO tooling"
          git push origin HEAD:feature/multilingual-seo-3279
