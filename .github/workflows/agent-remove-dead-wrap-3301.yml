name: Remove dead confirmed wrap 3.3.1
on:
  push:
    branches: [cleanup/remove-dead-confirmed-wrap-3301]
    paths:
      - '.github/workflows/agent-remove-dead-wrap-3301.yml'
      - '.github/agent-remove-dead-wrap-3301.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-dead-confirmed-wrap-3301
      - name: Apply scoped cleanup
        run: python .github/agent-remove-dead-wrap-3301.py
      - name: Validate
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/readme.txt plugins/garden-opening-status/readme.txt
          git diff --check
          grep -q "Version: 3.3.1" garden-opening-status/garden-opening-status.php
          grep -q "seasonal_confirmed_date_wrap" garden-opening-status/garden-opening-status.php
          ! grep -q "__confirmed_mobile_range" garden-opening-status/garden-opening-status.php
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add garden-opening-status plugins/garden-opening-status
          git diff --cached --quiet && exit 0
          git commit -m "Remove dead confirmed date wrap path in 3.3.1"
          git push
