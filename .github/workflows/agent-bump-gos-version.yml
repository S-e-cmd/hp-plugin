name: Temporary guarded GOS version bump

on:
  push:
    branches:
      - agent/bump-gos-3275

permissions:
  contents: write

jobs:
  bump:
    if: github.event.head_commit.message == 'Add guarded version bump workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump plugin version
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          php_paths = [Path('garden-opening-status/garden-opening-status.php'), Path('plugins/garden-opening-status/garden-opening-status.php')]
          readme_paths = [Path('garden-opening-status/readme.txt'), Path('plugins/garden-opening-status/readme.txt')]
          php_texts = [p.read_text(encoding='utf-8') for p in php_paths]
          readme_texts = [p.read_text(encoding='utf-8') for p in readme_paths]
          if php_texts[0] != php_texts[1]: raise SystemExit('duplicate PHP copies differ before bump')
          if readme_texts[0] != readme_texts[1]: raise SystemExit('duplicate readme copies differ before bump')
          php = php_texts[0]
          if php.count('Version: 3.2.74') != 1 or php.count("const VERSION = '3.2.74';") != 1: raise SystemExit('unexpected PHP version markers')
          php = php.replace('Version: 3.2.74', 'Version: 3.2.75', 1).replace("const VERSION = '3.2.74';", "const VERSION = '3.2.75';", 1)
          readme = readme_texts[0]
          if not readme.startswith('開催情報・開催状況管理 3.2.74\n'): raise SystemExit('unexpected readme heading')
          entry = "開催情報・開催状況管理 3.2.75\n\n3.2.75:\n- 内部整理と責務分離を実施し、既存機能を維持したまま今後の機能追加時の変更範囲を明確化\n- 未使用コード・重複処理・死んだInstagram設定を整理\n- Instagram取得処理を通信・レスポンス解釈・正規化・保存の責務に整理\n- 管理画面入力処理とInstagramフック登録の境界を整理\n- 管理画面CSS・JavaScriptの不要コードを整理\n\n"
          readme = entry + readme
          for p in php_paths: p.write_text(php, encoding='utf-8')
          for p in readme_paths: p.write_text(readme, encoding='utf-8')
          PY
      - name: Validate
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/readme.txt plugins/garden-opening-status/readme.txt
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/agent-bump-gos-version.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden-opening-status plugins/garden-opening-status
          git commit -m "Bump garden opening status to 3.2.75"
          git push origin HEAD:agent/bump-gos-3275
