name: Apply news guide position 3.2.96
on:
  push:
    branches: [feature/news-guide-position-3296]
    paths: ['.github/workflows/agent-news-guide-3296.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/news-guide-position-3296
      - name: Apply patch
        run: python3 .github/agent-news-guide-3296.py
      - name: Validate
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/readme.txt plugins/garden-opening-status/readme.txt
          git diff --check
          grep -F 'Version: 3.2.96' garden-opening-status/garden-opening-status.php
          grep -F 'gos-permanent-guide-card--news' garden-opening-status/garden-opening-status.php
          grep -F 'var isNewsArchive=' garden-opening-status/garden-opening-status.php
          grep -F "firstNewsItem.parentNode.insertBefore(newsCard,firstNewsItem);" garden-opening-status/garden-opening-status.php
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add garden-opening-status plugins/garden-opening-status
          git commit -m 'Move news guide card above article list in 3.2.96'
          git push origin HEAD:feature/news-guide-position-3296
