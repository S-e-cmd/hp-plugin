name: Temporary guarded PHP cleanup

on:
  push:
    branches:
      - agent/cleanup-dead-page-sync-and-php74

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary guarded PHP cleanup workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact guarded cleanup
        shell: python
        run: |
          from pathlib import Path

          paths = [
              Path('garden-opening-status/garden-opening-status.php'),
              Path('plugins/garden-opening-status/garden-opening-status.php'),
          ]
          texts = [p.read_text(encoding='utf-8') for p in paths]
          if texts[0] != texts[1]:
              raise SystemExit('duplicate plugin copies are not identical before patch')

          text = texts[0]
          compat_old = "str_starts_with($version, 'v')"
          compat_new = "strpos($version, 'v') === 0"
          if text.count(compat_old) != 1:
              raise SystemExit(f'unexpected str_starts_with occurrence count: {text.count(compat_old)}')
          text = text.replace(compat_old, compat_new, 1)

          start_marker = '    private static function event_page_managed_block($event, $season) {'
          end_marker = '    public static function handle_save() {'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('dead page-sync block boundaries are not unique')
          start = text.index(start_marker)
          end = text.index(end_marker)
          if end <= start:
              raise SystemExit('dead page-sync block boundaries are reversed')

          dead_block = text[start:end]
          required = [
              'private static function event_page_managed_block(',
              'private static function replace_existing_event_section(',
              'private static function sync_existing_event_pages(',
              'public static function page_sync_admin_notice(',
          ]
          for needle in required:
              if dead_block.count(needle) != 1:
                  raise SystemExit(f'unexpected dead-block member count for {needle}: {dead_block.count(needle)}')
          forbidden = [
              'public static function handle_save(',
              'private static function filter_event_page_output(',
          ]
          for needle in forbidden:
              if needle in dead_block:
                  raise SystemExit(f'live function unexpectedly inside deletion block: {needle}')

          text = text[:start] + text[end:]
          if 'str_starts_with(' in text:
              raise SystemExit('PHP 8 str_starts_with remains after patch')
          for needle in required:
              if needle in text:
                  raise SystemExit(f'dead page-sync method remains after patch: {needle}')

          for p in paths:
              p.write_text(text, encoding='utf-8')
      - name: PHP syntax check
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/agent-safe-php-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git commit -m "Remove dead page sync path and restore PHP 7.4 compatibility"
          git push origin HEAD:agent/cleanup-dead-page-sync-and-php74
