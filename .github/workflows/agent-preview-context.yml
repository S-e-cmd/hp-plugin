name: Temporary guarded preview context cleanup

on:
  push:
    branches:
      - agent/centralize-preview-context

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Add guarded preview context cleanup workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Centralize preview context checks
        shell: python
        run: |
          from pathlib import Path
          paths = [Path('garden-opening-status/garden-opening-status.php'), Path('plugins/garden-opening-status/garden-opening-status.php')]
          texts = [p.read_text(encoding='utf-8') for p in paths]
          if texts[0] != texts[1]:
              raise SystemExit('duplicate PHP copies differ before cleanup')
          text = texts[0]
          anchor = "    private static function is_status_preview() {\n        return current_user_can('manage_options') && !empty($_GET['garden_status_preview']);\n    }\n"
          insert = "    private static function is_status_preview() {\n        return current_user_can('manage_options') && !empty($_GET['garden_status_preview']);\n    }\n\n    private static function is_event_info_preview() {\n        return current_user_can('manage_options') && !empty($_GET['gos_event_info_preview']);\n    }\n\n    private static function is_any_preview() {\n        return self::is_status_preview() || self::is_event_info_preview();\n    }\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'unexpected status preview helper count: {text.count(anchor)}')
          text = text.replace(anchor, insert, 1)
          replacements = [
              ("        if (!current_user_can('manage_options')) return $is_mobile;\n        if (empty($_GET['garden_status_preview']) && empty($_GET['gos_event_info_preview'])) return $is_mobile;", "        if (!self::is_any_preview()) return $is_mobile;"),
              ("        if (current_user_can('manage_options') && (!empty($_GET['garden_status_preview']) || !empty($_GET['gos_event_info_preview']))) {", "        if (self::is_any_preview()) {"),
              ("        if (!current_user_can('manage_options') || empty($_GET['gos_event_info_preview'])) return '';", "        if (!self::is_event_info_preview()) return '';"),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected predicate count for {old!r}: {text.count(old)}')
              text = text.replace(old, new, 1)
          for p in paths:
              p.write_text(text, encoding='utf-8')
      - name: Validate PHP and duplicate copies
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/agent-preview-context.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git commit -m "Centralize preview context checks"
          git push origin HEAD:agent/centralize-preview-context
