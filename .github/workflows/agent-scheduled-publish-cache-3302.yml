name: Fix scheduled publish cache 3.3.2
on:
  push:
    branches: [fix/scheduled-publish-cache-purge-3302]
    paths:
      - '.github/workflows/agent-scheduled-publish-cache-3302.yml'
      - '.github/agent-scheduled-publish-cache-3302.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scheduled-publish-cache-purge-3302
      - name: Apply scoped patch
        run: python .github/agent-scheduled-publish-cache-3302.py
      - name: Validate
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/readme.txt plugins/garden-opening-status/readme.txt
          git diff --check
          grep -q "Version: 3.3.2" garden-opening-status/garden-opening-status.php
          grep -q "gos_v3_scheduled_publish" garden-opening-status/garden-opening-status.php
          grep -q "wp_schedule_single_event" garden-opening-status/garden-opening-status.php
          grep -q "wp_unschedule_event" garden-opening-status/garden-opening-status.php
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add garden-opening-status plugins/garden-opening-status
          git diff --cached --quiet && exit 0
          git commit -m "Fix scheduled publish cache invalidation in 3.3.2"
          git push
