name: Run Instagram lightbox patch

on:
  push:
    branches:
      - feature/instagram-lightbox-3276

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run Instagram lightbox patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/agent-instagram-lightbox-3276.py
      - name: Validate
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/readme.txt plugins/garden-opening-status/readme.txt
          grep -q "instagram_lightbox_assets" garden-opening-status/garden-opening-status.php
          grep -q "data-gos-instagram-lightbox" garden-opening-status/garden-opening-status.php
          git diff --check
      - name: Commit source only
        run: |
          git rm .github/workflows/agent-instagram-lightbox-3276.yml .github/workflows/agent-instagram-lightbox-3276-run.yml .github/agent-instagram-lightbox-3276.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden-opening-status plugins/garden-opening-status
          git commit -m "Add Instagram gallery lightbox in 3.2.76"
          git push origin HEAD:feature/instagram-lightbox-3276
