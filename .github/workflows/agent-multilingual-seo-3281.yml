name: Apply multilingual SEO 3.2.81
on:
  push:
    branches: [feature/multilingual-seo-3281]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'S-e-cmd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multilingual-seo-3281
          fetch-depth: 0
      - name: Apply scoped patch
        run: python .github/agent-multilingual-seo-3281.py
      - name: Validate
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/readme.txt plugins/garden-opening-status/readme.txt
          git diff --check
          grep -F "aioseo_description" garden-opening-status/garden-opening-status.php
          grep -F "Garden Opening Status 3.2.81 multilingual SEO active" garden-opening-status/garden-opening-status.php
      - name: Commit source changes and remove temporary files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add garden-opening-status plugins/garden-opening-status
          git commit -m "Keep multilingual SEO on AIOSEO filters in 3.2.81"
          git rm .github/agent-multilingual-seo-3281.py .github/workflows/agent-multilingual-seo-3281.yml
          git commit -m "Remove temporary multilingual SEO 3.2.81 workflow"
          git push origin HEAD:feature/multilingual-seo-3281
