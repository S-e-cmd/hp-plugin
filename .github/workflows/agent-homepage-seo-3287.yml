name: Apply homepage SEO 3.2.87
on:
  push:
    branches: [feature/homepage-seo-3287]
    paths: ['.github/workflows/agent-homepage-seo-3287.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/homepage-seo-3287
      - name: Apply patch
        run: python3 .github/agent-patch-gos-3287.py
      - name: Validate
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/readme.txt plugins/garden-opening-status/readme.txt
          git diff --check
          grep -F 'Version: 3.2.87' garden-opening-status/garden-opening-status.php
          grep -F '東京・上野の日本庭園｜季節の花を楽しむ上野東照宮ぼたん苑' garden-opening-status/garden-opening-status.php
          grep -F 'filter_aioseo_homepage_schema' garden-opening-status/garden-opening-status.php
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden-opening-status plugins/garden-opening-status
          git commit -m "Strengthen Japanese homepage SEO in 3.2.87"
          git push origin HEAD:feature/homepage-seo-3287
