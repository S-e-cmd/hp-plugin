name: Apply schedule index SEO 3.2.88
on:
  push:
    branches: [feature/schedule-index-seo-3288]
    paths: ['.github/workflows/agent-schedule-index-seo-3288.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/schedule-index-seo-3288
      - name: Apply patch
        run: python3 .github/agent-patch-gos-3288.py
      - name: Validate
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/readme.txt plugins/garden-opening-status/readme.txt
          git diff --check
          grep -F 'Version: 3.2.88' garden-opening-status/garden-opening-status.php
          grep -F '東京・上野で楽しむ季節の花｜春の牡丹・秋のダリア・冬の牡丹' garden-opening-status/garden-opening-status.php
          grep -F 'filter_aioseo_schedule_index_schema' garden-opening-status/garden-opening-status.php
          grep -F "is_page('schedule')" garden-opening-status/garden-opening-status.php
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden-opening-status plugins/garden-opening-status
          git commit -m "Optimize schedule index SEO metadata in 3.2.88"
          git push origin HEAD:feature/schedule-index-seo-3288
