name: Temporary guarded Instagram request extraction

on:
  push:
    branches:
      - agent/request-instagram-media

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Add guarded Instagram request extraction workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Instagram request seam
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          paths = [Path('garden-opening-status/garden-opening-status.php'), Path('plugins/garden-opening-status/garden-opening-status.php')]
          texts = [p.read_text(encoding='utf-8') for p in paths]
          if texts[0] != texts[1]:
              raise SystemExit('duplicate PHP copies differ before cleanup')
          text = texts[0]

          old_lines = [
              "        $fields = 'id,caption,media_type,media_url,thumbnail_url,permalink,timestamp';",
              "        if ($o['ig_user_id'] !== '') {",
              "            $url = 'https://graph.facebook.com/' . rawurlencode($o['api_version']) . '/' . rawurlencode($o['ig_user_id']) . '/media';",
              "        } else {",
              "            $url = 'https://graph.instagram.com/' . rawurlencode($o['api_version']) . '/me/media';",
              "        }",
              "        $url = add_query_arg(['fields'=>$fields,'limit'=>max(12,(int)$o['limit'])], $url);",
              "        $response = wp_remote_get($url, [",
              "            'timeout' => 20,",
              "            'headers' => ['Authorization' => 'Bearer ' . $o['access_token']],",
              "        ]);",
          ]
          old = '\n'.join(old_lines)
          if text.count(old) != 1:
              raise SystemExit(f'unexpected request block count: {text.count(old)}')
          text = text.replace(old, "        $response = self::request_instagram_media($o);", 1)

          anchor = "    public static function instagram_refresh() {\n"
          helper_lines = [
              "    private static function request_instagram_media($options) {",
              "        $fields = 'id,caption,media_type,media_url,thumbnail_url,permalink,timestamp';",
              "        if ($options['ig_user_id'] !== '') {",
              "            $url = 'https://graph.facebook.com/' . rawurlencode($options['api_version']) . '/' . rawurlencode($options['ig_user_id']) . '/media';",
              "        } else {",
              "            $url = 'https://graph.instagram.com/' . rawurlencode($options['api_version']) . '/me/media';",
              "        }",
              "        $url = add_query_arg(['fields'=>$fields,'limit'=>max(12,(int)$options['limit'])], $url);",
              "        return wp_remote_get($url, [",
              "            'timeout' => 20,",
              "            'headers' => ['Authorization' => 'Bearer ' . $options['access_token']],",
              "        ]);",
              "    }",
              "",
              "    public static function instagram_refresh() {",
          ]
          helper = '\n'.join(helper_lines) + '\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'unexpected refresh anchor count: {text.count(anchor)}')
          text = text.replace(anchor, helper, 1)

          if text.count('private static function request_instagram_media($options)') != 1:
              raise SystemExit('request helper count mismatch')
          if text.count('self::request_instagram_media($o);') != 1:
              raise SystemExit('request helper call mismatch')
          if text.count('wp_remote_get($url, [') != 1:
              raise SystemExit('wp_remote_get should exist only inside request helper')

          for p in paths:
              p.write_text(text, encoding='utf-8')
          PY
      - name: Validate PHP and duplicate copies
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/agent-request-instagram-media.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git commit -m "Extract Instagram request transport"
          git push origin HEAD:agent/request-instagram-media
