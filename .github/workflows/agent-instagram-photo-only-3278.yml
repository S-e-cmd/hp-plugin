name: Temporary Instagram photo-only lightbox 3.2.78

on:
  push:
    branches:
      - feature/instagram-lightbox-photo-only-3278

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Add guarded Instagram photo-only lightbox workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply photo-only lightbox
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          php_paths=[Path('garden-opening-status/garden-opening-status.php'),Path('plugins/garden-opening-status/garden-opening-status.php')]
          readme_paths=[Path('garden-opening-status/readme.txt'),Path('plugins/garden-opening-status/readme.txt')]
          php_texts=[p.read_text(encoding='utf-8') for p in php_paths]
          readme_texts=[p.read_text(encoding='utf-8') for p in readme_paths]
          if php_texts[0]!=php_texts[1]: raise SystemExit('PHP mirrors differ before change')
          if readme_texts[0]!=readme_texts[1]: raise SystemExit('readme mirrors differ before change')
          text=php_texts[0]
          if text.count('Version: 3.2.77')!=1 or text.count("const VERSION = '3.2.77';")!=1: raise SystemExit('unexpected version markers')
          text=text.replace('Version: 3.2.77','Version: 3.2.78',1).replace("const VERSION = '3.2.77';","const VERSION = '3.2.78';",1)
          text=text.replace("                'open' => 'Open on Instagram',\n",'',1)
          text=text.replace("                'open' => '在 Instagram 開啟',\n",'',1)
          text=text.replace("                'open' => 'Instagramで開く',\n",'',1)
          old_css='.gos-instagram-lightbox__dialog{position:relative;max-width:min(92vw,980px);max-height:94vh;padding:18px 18px 12px;background:#fff7ef;box-shadow:0 12px 46px rgba(0,0,0,.35);box-sizing:border-box;overflow:auto}.gos-instagram-lightbox__image{display:block;max-width:100%;max-height:calc(94vh - 145px);width:auto;height:auto;margin:0 auto;object-fit:contain}.gos-instagram-lightbox__caption{margin:12px 4px 0;color:#111;font-size:18px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.gos-instagram-lightbox__instagram{display:inline-block;margin:8px 4px 0;color:#555!important;font-size:13px;text-decoration:underline!important}'
          new_css='.gos-instagram-lightbox__dialog{position:relative;max-width:min(92vw,980px);max-height:94vh;padding:18px;background:#fff;box-shadow:0 12px 46px rgba(0,0,0,.35);box-sizing:border-box}.gos-instagram-lightbox__image{display:block;max-width:100%;max-height:calc(94vh - 36px);width:auto;height:auto;margin:0 auto;object-fit:contain}'
          if text.count(old_css)!=1: raise SystemExit('desktop lightbox CSS boundary not found')
          text=text.replace(old_css,new_css,1)
          old_mobile='.gos-instagram-lightbox__dialog{max-width:100%;max-height:92vh;padding:10px 10px 9px}.gos-instagram-lightbox__image{max-height:calc(92vh - 125px)}.gos-instagram-lightbox__caption{font-size:15px;margin-top:9px}'
          new_mobile='.gos-instagram-lightbox__dialog{max-width:100%;max-height:92vh;padding:10px}.gos-instagram-lightbox__image{max-height:calc(92vh - 20px)}'
          if text.count(old_mobile)!=1: raise SystemExit('mobile lightbox CSS boundary not found')
          text=text.replace(old_mobile,new_mobile,1)
          old_html="modal.innerHTML='<button type=\"button\" class=\"gos-instagram-lightbox__close\">×</button><div class=\"gos-instagram-lightbox__dialog\"><img class=\"gos-instagram-lightbox__image\" alt=\"\"><div class=\"gos-instagram-lightbox__caption\"></div><a class=\"gos-instagram-lightbox__instagram\" target=\"_blank\" rel=\"noopener noreferrer\"></a></div>';"
          new_html="modal.innerHTML='<button type=\"button\" class=\"gos-instagram-lightbox__close\">×</button><div class=\"gos-instagram-lightbox__dialog\"><img class=\"gos-instagram-lightbox__image\" alt=\"\"></div>';"
          if text.count(old_html)!=1: raise SystemExit('lightbox HTML boundary not found')
          text=text.replace(old_html,new_html,1)
          old_line="                modal.querySelector('.gos-instagram-lightbox__instagram').textContent=labels.open;\n"
          if text.count(old_line)!=1: raise SystemExit('open label line not found')
          text=text.replace(old_line,'',1)
          old_open="                var caption=item.getAttribute('data-gos-caption')||'';\n                var captionEl=box.querySelector('.gos-instagram-lightbox__caption');\n                captionEl.textContent=caption;\n                captionEl.hidden=!caption;\n                var link=box.querySelector('.gos-instagram-lightbox__instagram');\n                link.href=item.href;\n"
          if text.count(old_open)!=1: raise SystemExit('caption/link open block not found')
          text=text.replace(old_open,'',1)
          old_attr=' data-gos-caption="<?php echo esc_attr((string)$item[\'caption\']); ?>"'
          if text.count(old_attr)!=1: raise SystemExit('caption data attribute not found')
          text=text.replace(old_attr,'',1)
          readme=readme_texts[0]
          if not readme.startswith('開催情報・開催状況管理 3.2.77\n'): raise SystemExit('unexpected readme heading')
          entry='開催情報・開催状況管理 3.2.78\n\n3.2.78:\n- Instagram画像拡大表示を写真のみのシンプルなモーダルへ変更\n- 投稿本文とInstagram投稿リンクのモーダル内表示を削除\n- 閉じる操作とページ言語別のアクセシビリティ文言は維持\n\n'
          readme=entry+readme
          for p in php_paths: p.write_text(text,encoding='utf-8')
          for p in readme_paths: p.write_text(readme,encoding='utf-8')
          PY
      - name: Validate
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/readme.txt plugins/garden-opening-status/readme.txt
          ! grep -q 'gos-instagram-lightbox__caption' garden-opening-status/garden-opening-status.php
          ! grep -q 'gos-instagram-lightbox__instagram' garden-opening-status/garden-opening-status.php
          ! grep -q 'data-gos-caption' garden-opening-status/garden-opening-status.php
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/agent-instagram-photo-only-3278.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden-opening-status plugins/garden-opening-status
          git commit -m "Simplify Instagram lightbox to photo only in 3.2.78"
          git push origin HEAD:feature/instagram-lightbox-photo-only-3278
