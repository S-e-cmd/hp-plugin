name: Apply winter page SEO 3.2.91
on:
  push:
    branches: [feature/winter-page-seo-3291]
    paths: ['.github/workflows/agent-winter-seo-3291.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/winter-page-seo-3291
      - name: Apply patch
        run: python3 .github/agent-winter-3291.py
      - name: Validate
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/readme.txt plugins/garden-opening-status/readme.txt
          git diff --check
          grep -F 'Version: 3.2.91' garden-opening-status/garden-opening-status.php
          grep -F '東京・上野で冬咲き牡丹を楽しむ' garden-opening-status/garden-opening-status.php
          grep -F '$is_winter = $season === '\''winter'\'';' garden-opening-status/garden-opening-status.php
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add garden-opening-status plugins/garden-opening-status
          git commit -m 'Optimize winter page SEO metadata in 3.2.91'
          git push origin HEAD:feature/winter-page-seo-3291
