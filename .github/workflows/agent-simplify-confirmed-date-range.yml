name: Temporary guarded confirmed date cleanup

on:
  push:
    branches:
      - agent/simplify-confirmed-date-range

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Add guarded confirmed date cleanup workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify confirmed date range handling
        shell: python
        run: |
          from pathlib import Path
          paths = [Path('garden-opening-status/garden-opening-status.php'), Path('plugins/garden-opening-status/garden-opening-status.php')]
          texts = [p.read_text(encoding='utf-8') for p in paths]
          if texts[0] != texts[1]:
              raise SystemExit('duplicate PHP copies differ before cleanup')
          text = texts[0]
          old = '\n'.join([
              "        if ($mode === 'confirmed') {",
              "            $start = trim((string)($event['start'] ?? ''));",
              "            $end = trim((string)($event['end'] ?? ''));",
              "",
              "            if ($start !== '' && $end !== '') {",
              "                return self::format_date_range($start, $end);",
              "            }",
              "            if ($start !== '') return self::format_date_range($start, $start);",
              "            if ($end !== '') return self::format_date_range($end, $end);",
              "",
              "            return '';",
              "        }",
          ])
          new = '\n'.join([
              "        if ($mode === 'confirmed') {",
              "            $start = trim((string)($event['start'] ?? ''));",
              "            $end = trim((string)($event['end'] ?? ''));",
              "            return self::format_date_range($start, $end);",
              "        }",
          ])
          if text.count(old) != 1:
              raise SystemExit(f'unexpected confirmed branch count: {text.count(old)}')
          text = text.replace(old, new, 1)
          for p in paths:
              p.write_text(text, encoding='utf-8')
      - name: Validate PHP and duplicate copies
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/agent-simplify-confirmed-date-range.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git commit -m "Simplify confirmed event date range handling"
          git push origin HEAD:agent/simplify-confirmed-date-range
