name: Temporary guarded known event page id cleanup

on:
  push:
    branches:
      - agent/centralize-known-event-page-ids

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Add guarded known event page id cleanup workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Centralize known event page ids
        shell: python
        run: |
          from pathlib import Path
          paths = [Path('garden-opening-status/garden-opening-status.php'), Path('plugins/garden-opening-status/garden-opening-status.php')]
          texts = [p.read_text(encoding='utf-8') for p in paths]
          if texts[0] != texts[1]:
              raise SystemExit('duplicate PHP copies differ before cleanup')
          text = texts[0]
          anchor = "    private static function resolve_event_page_id($event, $season) {\n"
          helper = "    private static function known_event_page_ids() {\n        return ['spring' => 19, 'autumn' => 47, 'winter' => 49];\n    }\n\n    private static function resolve_event_page_id($event, $season) {\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'unexpected resolve anchor count: {text.count(anchor)}')
          text = text.replace(anchor, helper, 1)
          old_resolve = "        $known_ids = ['spring' => 19, 'autumn' => 47, 'winter' => 49];\n        $known_id = (int)($known_ids[$season] ?? 0);"
          new_resolve = "        $known_id = (int)(self::known_event_page_ids()[$season] ?? 0);"
          if text.count(old_resolve) != 1:
              raise SystemExit(f'unexpected resolve known ids count: {text.count(old_resolve)}')
          text = text.replace(old_resolve, new_resolve, 1)
          old_current = "        $known_ids = [\n            19 => 'spring',\n            47 => 'autumn',\n            49 => 'winter',\n        ];\n        if (isset($known_ids[$page_id])) return $known_ids[$page_id];"
          new_current = "        foreach (self::known_event_page_ids() as $season => $known_id) {\n            if ($page_id === (int)$known_id) return $season;\n        }"
          if text.count(old_current) != 1:
              raise SystemExit(f'unexpected current known ids count: {text.count(old_current)}')
          text = text.replace(old_current, new_current, 1)
          for p in paths:
              p.write_text(text, encoding='utf-8')
      - name: Validate PHP and duplicate copies
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/agent-known-event-page-ids.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git commit -m "Centralize known event page ids"
          git push origin HEAD:agent/centralize-known-event-page-ids
