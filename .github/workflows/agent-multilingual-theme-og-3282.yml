name: Apply multilingual theme OG 3.2.82
on:
  push:
    branches: [feature/multilingual-theme-og-3282]
jobs:
  apply:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multilingual-theme-og-3282
      - name: Apply patch
        run: python .github/agent-apply-multilingual-theme-og-3282.py
      - name: Validate
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/readme.txt plugins/garden-opening-status/readme.txt
          git diff --check
          grep -q "Version: 3.2.82" garden-opening-status/garden-opening-status.php
          grep -q "start_multilingual_theme_og_output_buffer" garden-opening-status/garden-opening-status.php
      - name: Commit scoped changes and remove temporary files
        run: |
          rm .github/agent-apply-multilingual-theme-og-3282.py
          rm .github/workflows/agent-multilingual-theme-og-3282.yml
          git add garden-opening-status plugins/garden-opening-status .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove duplicate theme OG on multilingual pages in 3.2.82"
          git push origin HEAD:feature/multilingual-theme-og-3282
