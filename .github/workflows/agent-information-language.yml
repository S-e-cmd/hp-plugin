name: Temporary guarded information language cleanup

on:
  push:
    branches:
      - agent/centralize-information-language

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Add guarded information language cleanup workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Centralize information page language
        shell: python
        run: |
          from pathlib import Path
          paths = [Path('garden-opening-status/garden-opening-status.php'), Path('plugins/garden-opening-status/garden-opening-status.php')]
          texts = [p.read_text(encoding='utf-8') for p in paths]
          if texts[0] != texts[1]:
              raise SystemExit('duplicate PHP copies differ before cleanup')
          text = texts[0]
          anchor = "    /**\n     * English / Traditional Chinese pages use the correct document language\n     * without changing the site's global WordPress language setting.\n     */\n    public static function language_attributes($output, $doctype = 'html') {\n        $lang = '';\n        if (is_page('english')) {\n            $lang = 'en';\n        } elseif (is_page('chinese')) {\n            $lang = 'zh-Hant';\n        } elseif (is_front_page()) {\n            $lang = 'ja';\n        }\n"
          replacement = "    private static function information_page_language() {\n        if (is_page('english')) return 'en';\n        if (is_page('chinese')) return 'zh-Hant';\n        if (is_front_page()) return 'ja';\n        return '';\n    }\n\n    /**\n     * English / Traditional Chinese pages use the correct document language\n     * without changing the site's global WordPress language setting.\n     */\n    public static function language_attributes($output, $doctype = 'html') {\n        $lang = self::information_page_language();\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'unexpected language_attributes anchor count: {text.count(anchor)}')
          text = text.replace(anchor, replacement, 1)
          replacements = [
              ("        if (is_admin() || (!is_front_page() && !is_page(['english', 'chinese']))) return;", "        if (is_admin() || self::information_page_language() === '') return;", 1),
              ("        if (!is_front_page() && !is_page(['english', 'chinese'])) return;", "        if (self::information_page_language() === '') return;", 2),
          ]
          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'unexpected predicate count for {old!r}: {count}')
              text = text.replace(old, new)
          facility_anchor = "        $language = 'ja';\n        $name = '上野東照宮ぼたん苑';\n        $description = '上野東照宮の境内にある季節開苑の庭園。春と冬の牡丹、秋のダリアを展示しています。';\n\n        if (is_page('english')) {\n            $language = 'en';"
          facility_replacement = "        $language = self::information_page_language();\n        $name = '上野東照宮ぼたん苑';\n        $description = '上野東照宮の境内にある季節開苑の庭園。春と冬の牡丹、秋のダリアを展示しています。';\n\n        if ($language === 'en') {"
          if text.count(facility_anchor) != 1:
              raise SystemExit(f'unexpected facility language anchor count: {text.count(facility_anchor)}')
          text = text.replace(facility_anchor, facility_replacement, 1)
          facility_zh = "        } elseif (is_page('chinese')) {\n            $language = 'zh-Hant';"
          if text.count(facility_zh) != 1:
              raise SystemExit(f'unexpected facility zh branch count: {text.count(facility_zh)}')
          text = text.replace(facility_zh, "        } elseif ($language === 'zh-Hant') {", 1)
          for p in paths:
              p.write_text(text, encoding='utf-8')
      - name: Validate PHP and duplicate copies
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/agent-information-language.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git commit -m "Centralize information page language checks"
          git push origin HEAD:agent/centralize-information-language