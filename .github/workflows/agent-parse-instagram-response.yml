name: Temporary guarded Instagram response parser extraction

on:
  push:
    branches:
      - agent/php-unused-audit-2

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Add guarded Instagram response parser workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Instagram response parser
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          paths = [Path('garden-opening-status/garden-opening-status.php'), Path('plugins/garden-opening-status/garden-opening-status.php')]
          texts = [p.read_text(encoding='utf-8') for p in paths]
          if texts[0] != texts[1]:
              raise SystemExit('duplicate PHP copies differ before cleanup')
          text = texts[0]

          old_lines = [
              "        $code = wp_remote_retrieve_response_code($response);",
              "        $body = json_decode(wp_remote_retrieve_body($response), true);",
              "        if ($code < 200 || $code >= 300 || !is_array($body) || !isset($body['data'])) {",
              "            $msg = is_array($body) && !empty($body['error']['message']) ? $body['error']['message'] : 'HTTP ' . $code;",
              "            $o['last_error'] = sanitize_text_field($msg);",
              "            self::store_instagram_options($o);",
              "            return false;",
              "        }",
              "        $items = self::normalize_instagram_items($body['data']);",
          ]
          old = '\n'.join(old_lines)
          if text.count(old) != 1:
              raise SystemExit(f'unexpected response block count: {text.count(old)}')
          new_lines = [
              "        $parsed = self::parse_instagram_media_response($response);",
              "        if ($parsed['error'] !== '') {",
              "            $o['last_error'] = $parsed['error'];",
              "            self::store_instagram_options($o);",
              "            return false;",
              "        }",
              "        $items = self::normalize_instagram_items($parsed['data']);",
          ]
          text = text.replace(old, '\n'.join(new_lines), 1)

          anchor = "    public static function instagram_refresh() {\n"
          helper_lines = [
              "    private static function parse_instagram_media_response($response) {",
              "        $code = wp_remote_retrieve_response_code($response);",
              "        $body = json_decode(wp_remote_retrieve_body($response), true);",
              "        if ($code < 200 || $code >= 300 || !is_array($body) || !isset($body['data'])) {",
              "            $msg = is_array($body) && !empty($body['error']['message']) ? $body['error']['message'] : 'HTTP ' . $code;",
              "            return ['data' => [], 'error' => sanitize_text_field($msg)];",
              "        }",
              "        return ['data' => $body['data'], 'error' => ''];",
              "    }",
              "",
              "    public static function instagram_refresh() {",
          ]
          helper = '\n'.join(helper_lines) + '\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'unexpected refresh anchor count: {text.count(anchor)}')
          text = text.replace(anchor, helper, 1)

          if text.count('private static function parse_instagram_media_response($response)') != 1:
              raise SystemExit('parser helper count mismatch')
          if text.count('self::parse_instagram_media_response($response);') != 1:
              raise SystemExit('parser helper call mismatch')
          if text.count('wp_remote_retrieve_response_code($response)') != 1:
              raise SystemExit('response code extraction should exist only inside parser')
          if text.count('wp_remote_retrieve_body($response)') != 1:
              raise SystemExit('response body extraction should exist only inside parser')

          for p in paths:
              p.write_text(text, encoding='utf-8')
          PY
      - name: Validate PHP and duplicate copies
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/agent-parse-instagram-response.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          git commit -m "Extract Instagram response parser"
          git push origin HEAD:agent/php-unused-audit-2