name: Apply event page SEO 3.2.83
on:
  push:
    branches:
      - feature/event-page-seo-3283
    paths:
      - .github/workflows/agent-event-page-seo-3283.yml
      - .github/scripts/patch-event-page-seo-3283.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/event-page-seo-3283
      - name: Apply patch
        run: python3 .github/scripts/patch-event-page-seo-3283.py
      - name: Validate
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/readme.txt plugins/garden-opening-status/readme.txt
          git diff --check
          grep -F "filter_aioseo_event_page_title" garden-opening-status/garden-opening-status.php
          grep -F "filter_aioseo_event_page_description" garden-opening-status/garden-opening-status.php
      - name: Commit patch and remove temporary files
        run: |
          rm .github/workflows/agent-event-page-seo-3283.yml
          rm .github/scripts/patch-event-page-seo-3283.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Sync confirmed event dates into page SEO in 3.2.83'
          git push origin HEAD:feature/event-page-seo-3283
