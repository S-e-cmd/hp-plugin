name: Apply confirmed date mobile wrap 3.2.99
on:
  push:
    branches: [fix/mobile-confirmed-date-wrap-3299]
    paths:
      - '.github/workflows/agent-confirmed-date-wrap-3299.yml'
      - '.github/agent-confirmed-date-wrap-3299.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-confirmed-date-wrap-3299
      - name: Apply scoped patch
        run: python .github/agent-confirmed-date-wrap-3299.py
      - name: Validate
        run: |
          php -l garden-opening-status/garden-opening-status.php
          php -l plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/garden-opening-status.php plugins/garden-opening-status/garden-opening-status.php
          cmp garden-opening-status/readme.txt plugins/garden-opening-status/readme.txt
          git diff --check
          grep -q "Version: 3.2.99" garden-opening-status/garden-opening-status.php
          grep -q "__confirmed_mobile_range" garden-opening-status/garden-opening-status.php
          grep -q "gos-event-page-info__confirmed-date-end" garden-opening-status/garden-opening-status.php
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add garden-opening-status plugins/garden-opening-status
          git diff --cached --quiet && exit 0
          git commit -m "Wrap confirmed event end date on mobile in 3.2.99"
          git push
